<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>標價卡改價工具 V1.0</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f7fb; --panel:#fff; --ink:#172033; --muted:#6f7a8e; --line:#dfe5ef;
  --navy:#173a67; --blue:#2468d5; --blue2:#eaf2ff; --green:#15915c; --green2:#eaf8f1;
  --red:#d94343; --red2:#fff0f0; --amber:#b87906; --amber2:#fff7e7;
  --shadow:0 10px 26px rgba(28,49,82,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1480px;margin:0 auto;padding:24px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:56px;height:56px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line);flex:0 0 56px}.mark img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:28px;letter-spacing:.3px}.sub{margin-top:5px;color:var(--muted);font-size:14px}
.version{background:#eef3fa;border:1px solid #d9e2f0;padding:8px 12px;border-radius:999px;font-size:13px;color:#526079;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.upload-panel{padding:16px}
.dropzone{border:2px dashed #a9b8cc;border-radius:16px;padding:18px 18px;text-align:center;background:#fafcff;transition:.18s;cursor:pointer}
.dropzone.drag{border-color:var(--blue);background:var(--blue2)}
.dropzone .ico{font-size:30px;margin-bottom:6px}.dropzone strong{display:block;font-size:16px;margin-bottom:4px}.dropzone span{color:var(--muted);font-size:13px}
#fileInput{display:none}
.compare-strip{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.file-inline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-width:0;padding:8px 10px;border-radius:10px;background:#fbfcfe}
.file-inline.old{border-left:4px solid #7a879a}.file-inline.new{border-left:4px solid var(--blue)}
.file-inline .label{font-size:12px;font-weight:900;color:#66748b;white-space:nowrap}
.file-inline .name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.file-inline .time{font-size:12px;color:var(--muted);white-space:nowrap}
.compare-arrow{display:grid;place-items:center;color:#8a96a8;font-size:20px;font-weight:900}
.notice{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:13px;display:none}.notice.show{display:block}.notice.ok{background:var(--green2);color:#0f6f46}.notice.err{background:var(--red2);color:#a52929}.notice.warn{background:var(--amber2);color:#825600}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.stat{padding:16px;border-radius:15px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(28,49,82,.05)}.stat .k{font-size:12px;color:var(--muted);font-weight:700}.stat .v{font-size:25px;font-weight:900;margin-top:4px}.stat.blue .v{color:var(--blue)}.stat.green .v{color:var(--green)}.stat.red .v{color:var(--red)}.stat.amber .v{color:var(--amber)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.controls-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;color:#5c687c;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef2f7;color:#40506a}.btn.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.table-wrap{overflow:auto;max-height:570px}.table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}.table th{position:sticky;top:0;z-index:2;background:#f7f9fc;color:#526079;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #edf0f5;vertical-align:middle}.table tr:hover td{background:#fbfdff}.money{text-align:right;font-variant-numeric:tabular-nums}.up{color:var(--red);font-weight:800}.down{color:var(--green);font-weight:800}.same{color:var(--muted)}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;font-weight:800;font-size:11px}.tag.up{background:var(--red2)}.tag.down{background:var(--green2)}.tag.new{background:var(--blue2);color:var(--blue)}.tag.removed{background:#f1f3f6;color:#616c7e}.empty{padding:64px 20px;text-align:center;color:var(--muted)}
.footer{font-size:12px;color:#8a94a5;text-align:center;margin:16px 0 4px}.loading{display:none}.loading.show{display:inline-block}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.compare-strip{grid-template-columns:1fr}.compare-arrow{transform:rotate(90deg)}.file-inline{grid-template-columns:auto minmax(0,1fr)}.file-inline .time{grid-column:2}}
@media(max-width:680px){.wrap{padding:14px}.hero{align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.controls{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{flex:1}}
</style>
</head>

    <div id="tableArea" class="table-wrap"><div class="empty">請先匯入兩份 Excel</div></div>
  </section>
  <div class="footer">比對 Key：IMEI｜改價欄位：設定售價｜新舊判斷：Excel 內匯出時間</div>
</div>

<script>
(() => {
  const state={files:[], old:null,new:null,changed:[],added:[],removed:[],issues:[],filter:'changed'};
  const $=id=>document.getElementById(id);
  const dz=$('dropzone'), input=$('fileInput');

  function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('zh-TW'):String(v??'');}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function msg(text,type='ok'){const n=$('notice');n.textContent=text;n.className='notice show '+type;}
  function parseExportTime(v){const s=String(v??'');const m=s.match(/(20\d{2})[-\/]?(\d{1,2})[-\/]?(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return null;const [,y,mo,d,h,mi,se='00']=m;return new Date(+y,+mo-1,+d,+h,+mi,+se);}
  function fmtTime(d){return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`:'—';}
  function normImei(v){return String(v??'').trim();}
  function toNum(v){if(v===''||v==null)return 0;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:NaN;}
  function readCell(ws,addr){return ws[addr]?.v ?? ''}

  async function parseFile(file){
    if(typeof XLSX==='undefined') throw new Error('Excel 元件載入失敗，請確認電腦可連線後重新開啟工具。');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellStyles:true,cellDates:false,raw:true});
    const sheetName=wb.SheetNames.find(n=>n==='二手機回收紀錄') || wb.SheetNames[0];
    if(!sheetName)throw new Error(`${file.name} 找不到工作表。`);
    const ws=wb.Sheets[sheetName];
    const exportText=readCell(ws,'B1');
    const exportTime=parseExportTime(exportText);
    if(!exportTime)throw new Error(`${file.name} 無法讀取 B1 匯出時間。`);
    const ref=ws['!ref']; if(!ref)throw new Error(`${file.name} 沒有資料。`);
    const range=XLSX.utils.decode_range(ref);
    const headers=[];
    for(let c=range.s.c;c<=range.e.c;c++) headers[c]=String(readCell(ws,XLSX.utils.encode_cell({r:1,c}))??'').trim();
    const imeiCol=headers.findIndex(h=>h==='IMEI');
    const priceCol=headers.findIndex(h=>h==='設定售價');
    if(imeiCol<0||priceCol<0)throw new Error(`${file.name} 找不到「IMEI」或「設定售價」欄位。`);
    const rows=[]; const map=new Map(); const duplicates=[]; let blank=0;
    for(let r=2;r<=range.e.r;r++){
      const row=[]; for(let c=range.s.c;c<=range.e.c;c++) row[c]=readCell(ws,XLSX.utils.encode_cell({r,c}));
      if(row.every(v=>v===''||v==null))continue;
      const imei=normImei(row[imeiCol]);
      const rec={rowIndex:r,row,imei,price:toNum(row[priceCol])}; rows.push(rec);
      if(!imei){blank++;continue}
      if(map.has(imei))duplicates.push(imei); else map.set(imei,rec);
    }
    return {file,wb,ws,sheetName,exportText,exportTime,headers,imeiCol,priceCol,rows,map,duplicates:[...new Set(duplicates)],blank,range};
  }

  function getField(obj,name){const i=obj.headers.findIndex(h=>h===name);return i>=0?obj.row[i]:''}

  function compare(){
    const old=state.old,newer=state.new;
    state.changed=[];state.added=[];state.removed=[];state.issues=[];
    for(const [imei,nr] of newer.map){
      const or=old.map.get(imei);
      if(!or){state.added.push({type:'added',imei,newRec:nr,oldRec:null});continue}
      if(Number.isNaN(or.price)||Number.isNaN(nr.price)){state.issues.push({imei,reason:'設定售價不是數字'});continue}
      if(or.price!==nr.price){state.changed.push({type:nr.price>or.price?'up':'down',imei,oldRec:or,newRec:nr,oldPrice:or.price,newPrice:nr.price,diff:nr.price-or.price});}
    }
    for(const [imei,or] of old.map)if(!newer.map.has(imei))state.removed.push({type:'removed',imei,oldRec:or,newRec:null});
    if(old.blank)state.issues.push({reason:`舊檔 IMEI 空白 ${old.blank} 筆`});
    if(newer.blank)state.issues.push({reason:`新檔 IMEI 空白 ${newer.blank} 筆`});
    if(old.duplicates.length)state.issues.push({reason:`舊檔 IMEI 重複 ${old.duplicates.length} 組`});
    if(newer.duplicates.length)state.issues.push({reason:`新檔 IMEI 重複 ${newer.duplicates.length} 組`});
    renderSummary(); renderTable(); $('exportBtn').disabled=state.changed.length===0;
  }

  function renderSummary(){
    $('sTotal').textContent=state.new?.map.size??0;
    $('sChanged').textContent=state.changed.length;
    $('sUp').textContent=state.changed.filter(x=>x.type==='up').length;
    $('sDown').textContent=state.changed.filter(x=>x.type==='down').length;
    $('sAdded').textContent=state.added.length;
    $('sIssue').textContent=state.removed.length+state.issues.length;
  }

  function activeRows(){if(state.filter==='changed')return state.changed;if(state.filter==='up')return state.changed.filter(x=>x.type==='up');if(state.filter==='down')return state.changed.filter(x=>x.type==='down');if(state.filter==='added')return state.added;if(state.filter==='removed')return state.removed;return[]}
  function renderTable(){
    const rows=activeRows();$('rowCount').textContent=`共 ${rows.length} 筆`;
    if(!state.new){$('tableArea').innerHTML='<div class="empty">請先匯入兩份 Excel</div>';return}
    if(!rows.length){$('tableArea').innerHTML='<div class="empty">目前沒有符合條件的資料</div>';return}
    let html='<table class="table"><thead><tr><th>狀態</th><th>IMEI</th><th>品牌</th><th>回收機款</th><th>等級</th><th>所在門市</th><th class="money">舊設定售價</th><th class="money">新設定售價</th><th class="money">差額</th></tr></thead><tbody>';
    for(const x of rows){
      const rec=x.newRec||x.oldRec; const base=x.newRec?state.new:state.old;
      const brand=getField({headers:base.headers,row:rec.row},'品牌'); const model=getField({headers:base.headers,row:rec.row},'回收機款'); const grade=getField({headers:base.headers,row:rec.row},'等級'); const store=getField({headers:base.headers,row:rec.row},'所在門市');
      const label=x.type==='up'?'漲價':x.type==='down'?'降價':x.type==='added'?'新增':'已移除';
      const oldP=x.oldRec?x.oldRec.price:''; const newP=x.newRec?x.newRec.price:''; const diff=(x.oldRec&&x.newRec)?newP-oldP:'';
      html+=`<tr><td><span class="tag ${x.type}">${label}</span></td><td>${esc(x.imei)}</td><td>${esc(brand)}</td><td>${esc(model)}</td><td>${esc(grade)}</td><td>${esc(store)}</td><td class="money">${x.oldRec?money(oldP):'—'}</td><td class="money">${x.newRec?money(newP):'—'}</td><td class="money ${diff>0?'up':diff<0?'down':'same'}">${diff===''?'—':(diff>0?'+':'')+money(diff)}</td></tr>`;
    }
    html+='</tbody></table>';$('tableArea').innerHTML=html;
  }

  function copyCell(cell){if(!cell)return undefined;const o={};for(const k of Object.keys(cell))o[k]=(typeof cell[k]==='object'&&cell[k]!==null)?JSON.parse(JSON.stringify(cell[k])):cell[k];return o}
  function buildExportWorksheet(){
    const src=state.new.ws, maxC=state.new.range.e.c, out={};
    // 保留第 1、2 列
    for(let r=0;r<=1;r++)for(let c=0;c<=maxC;c++){const a=XLSX.utils.encode_cell({r,c});if(src[a])out[a]=copyCell(src[a]);}
    state.changed.forEach((x,i)=>{const srcR=x.newRec.rowIndex,dstR=i+2;for(let c=0;c<=maxC;c++){const sa=XLSX.utils.encode_cell({r:srcR,c}),da=XLSX.utils.encode_cell({r:dstR,c});if(src[sa])out[da]=copyCell(src[sa]);}});
    out['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(1,state.changed.length+1),c:maxC}});
    if(src['!cols'])out['!cols']=JSON.parse(JSON.stringify(src['!cols']));
    if(src['!rows']){out['!rows']=[];out['!rows'][0]=src['!rows'][0];out['!rows'][1]=src['!rows'][1];state.changed.forEach((x,i)=>out['!rows'][i+2]=src['!rows'][x.newRec.rowIndex]);}
    if(src['!merges'])out['!merges']=src['!merges'].filter(m=>m.e.r<=1).map(m=>JSON.parse(JSON.stringify(m)));
    return out;
  }
  function exportChanged(){
    if(!state.new||!state.changed.length)return;
    const wb={SheetNames:[state.new.sheetName],Sheets:{},Workbook:state.new.wb.Workbook,Props:state.new.wb.Props,Custprops:state.new.wb.Custprops};
    wb.Sheets[state.new.sheetName]=buildExportWorksheet();
    const t=fmtTime(state.new.exportTime).replace(/[-: ]/g,'').slice(0,14);
    XLSX.writeFile(wb,`標價卡改價_${t}_${state.changed.length}筆.xlsx`,{bookType:'xlsx',cellStyles:true});
  }

  async function handleFiles(fileList){
    const files=[...fileList].filter(f=>/\.xlsx?$/i.test(f.name));
    if(files.length!==2){msg('請一次選擇「兩份」Excel：改價前與改價後。工具會自動依匯出時間判斷。','warn');return}
    try{
      msg('正在讀取兩份 Excel…','warn');
      const parsed=await Promise.all(files.map(parseFile));
      parsed.sort((a,b)=>a.exportTime-b.exportTime);
      if(parsed[0].exportTime.getTime()===parsed[1].exportTime.getTime())throw new Error('兩份 Excel 的匯出時間相同，無法判斷新舊。');
      state.old=parsed[0];state.new=parsed[1];state.files=files;
      $('oldName').textContent=state.old.file.name;$('oldTime').textContent=`匯出時間：${fmtTime(state.old.exportTime)}`;
      $('newName').textContent=state.new.file.name;$('newTime').textContent=`匯出時間：${fmtTime(state.new.exportTime)}`;
      compare();
      const extras=[];if(state.issues.length)extras.push(`另有 ${state.issues.length} 項資料檢查提醒`);if(state.removed.length)extras.push(`${state.removed.length} 筆舊檔有、新檔無`);
      msg(`判斷完成：共找到 ${state.changed.length} 筆設定售價異動${extras.length?'；'+extras.join('；'):''}。`,'ok');
    }catch(e){console.error(e);clearAll(false);msg(e.message||'Excel 讀取失敗。','err')}
  }
  function clearAll(hide=true){state.files=[];state.old=null;state.new=null;state.changed=[];state.added=[];state.removed=[];state.issues=[];state.filter='changed';input.value='';$('oldName').textContent='尚未載入';$('newName').textContent='尚未載入';$('oldTime').textContent='—';$('newTime').textContent='—';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter==='changed'));renderSummary();renderTable();$('exportBtn').disabled=true;if(hide)$('notice').className='notice'}

  dz.addEventListener('click',()=>input.click());input.addEventListener('change',e=>handleFiles(e.target.files));
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));
  $('clearBtn').addEventListener('click',()=>clearAll());$('exportBtn').addEventListener('click',exportChanged);
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderTable()}));
})();
</script>
</body>
</html>
